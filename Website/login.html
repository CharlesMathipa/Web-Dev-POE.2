<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Always & Forever Blooms - Sign In / Register</title>
</head>
<body>

  <section id="header-section">
    <a href="Homepage.html"><img src="images/logo.jpeg" alt="Always and Forever Blooms Logo" class="logo"></a>
    <ul id="navbar">
      <li><a href="Homepage.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="faq.html">FAQ</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a class="active" href="login.html"><i class="bi bi-person"></i></a></li>
    </ul>
  </section>

  <main style="max-width: 600px;">
    <h1>Customer Account Access</h1>
    <p style="color: var(--brand-muted); margin-bottom: 24px;">Sign in to track orders easily or create an account for faster checkout.</p>

    <section>
      <h2>Sign In</h2>
      <br>
      <form action="Homepage.html" method="GET">
        <label for="signin-email">Email Address:</label>
        <input type="email" id="signin-email" name="email" required><br><br>

        <label for="signin-password">Password:</label>
        <input type="password" id="signin-password" name="password" required><br><br>

        <button type="submit" style="width: 100%;">Sign In to Account</button>
      </form>
    </section>

    <section style="margin-top: 30px;">
      <h2>Create New Account</h2>
      <br>
      <form action="Homepage.html" method="POST">
        <label for="reg-name">Full Name:</label>
        <input type="text" id="reg-name" name="fullname" required><br><br>

        <label for="reg-email">Email Address:</label>
        <input type="email" id="reg-email" name="reg_email" required><br><br>

        <label for="reg-phone">Mobile Phone:</label>
        <input type="tel" id="reg-phone" name="reg_phone" placeholder="0610667057" required><br><br>

        <label for="reg-password">Create Password:</label>
        <input type="password" id="reg-password" name="reg_password" required><br><br>

        <button type="submit" style="width: 100%;">Register Account</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Always & Forever Blooms. All rights reserved.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
